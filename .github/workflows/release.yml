name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Keystore aus Secret wiederherstellen
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "AWAKENED_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        env:
          AWAKENED_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AWAKENED_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AWAKENED_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/awakened.apk
          echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Signatur prüfen
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs dist/awakened.apk | head -5

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: awakened-${{ env.VERSION }}
          path: dist/awakened.apk

      - name: GitHub Release erstellen
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AWAKENED ${{ env.VERSION }}
          make_latest: true
          body: |
            Automatischer Build von `${{ github.sha }}`.

            **Installation:** `awakened.apk` herunterladen und öffnen. Anleitung siehe README.
          files: dist/awakened.apk
